[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d405-handeye"
version = "0.1.0"
description = "Native eye-in-hand calibration with on-demand ROS 2 poses"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "PyYAML>=6"]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.8,<5"]
gui = ["PyQt5>=5.15,<6"]
test = ["pytest>=7"]

[project.scripts]
handeye = "handeye_core.cli:main"

[tool.setuptools.packages.find]
include = ["handeye_core*", "handeye_gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

